services:
  server:
    build: ./server
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    environment:
      SQLITE_PATH: /data/progress.sqlite
    volumes:
      - sqlite-data:/data
  ui:
    build: ./ui
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./ui:/app
      - ui-node-modules:/app/node_modules
    depends_on:
      - server

volumes:
  sqlite-data:
  ui-node-modules:
